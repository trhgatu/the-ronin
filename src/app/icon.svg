<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Subtle Dark Background Squircle -->
  <rect width="64" height="64" rx="16" fill="#0c0c0c"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Katana / Calligraphy Monogram 'T' -->
  <g fill="#f5f5f5">
    <!-- Horizontal Slash (Katana blade stroke) -->
    <path d="M 12 18.5 C 18 17.5 44 16.5 52 17.5 C 47 21 39 23.5 14 24.5 C 11.5 24 10.5 19 12 18.5 Z"/>
    
    <!-- Vertical Descent Stroke (Blade edge tapering down) -->
    <path d="M 29 23 L 34.5 22.5 L 34 45 C 33.8 49 31 51 28 50 C 28.5 46 29 38 29 23 Z"/>
  </g>

  <!-- Hanko Crimson Accent Seal -->
  <rect x="42" y="41" width="9" height="9" rx="2" fill="#dc2626"/>
  <rect x="44" y="43" width="5" height="5" rx="1" fill="#f5f5f5" opacity="0.9"/>
</svg>
